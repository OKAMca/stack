packages:
  - 'apps/*'
  - 'libs/*'
  - 'libs/stack/*'
  - 'libs/directus/*'

overrides:
  dotenv: ^16.4.7
  axios: ">=1.20.0 <2"
  flatted: ">=3.4.0"
  immutable: ">=5.1.5"
  koa: ">=3.1.2"
  minimatch: ">=11.0.1 <12"
  # glob 8 (via @rollup/plugin-commonjs 25) crashes with minimatch 11; minimatch 5.1.9 is outside the advisory range.
  # Drop when nothing depends on glob 8.
  "glob@8>minimatch": ">=5.1.9 <6"
  "minimatch@5>brace-expansion": ">=2.1.7 <3"
  rollup: ">=4.60.0"
  serialize-javascript: ">=7.1.3 <8"
  "svgo@3": ">=3.3.5 <4"
  tar: ">=7.5.16 <8"
  picomatch: ">=4.0.4"
  yaml: ">=1.10.3"
  # security: bounded within-major to clear Dependabot alerts
  "@babel/core": ">=7.29.6 <8"
  "@babel/plugin-transform-modules-systemjs": ">=7.29.4 <8"
  "@xhmikosr/decompress": ">=10.2.2 <11"
  adm-zip: ">=0.6.1 <0.7"
  brace-expansion: ">=5.0.12 <6"
  fast-uri: ">=3.1.8 <4"
  form-data: ">=4.0.6 <5"
  "http-proxy-middleware@2": ">=2.0.10 <3"
  "http-proxy-middleware@3": ">=3.0.7 <4"
  "js-yaml@3": ">=3.15.2 <4"
  "js-yaml@4": ">=4.3.2 <5"
  launch-editor: ">=2.14.1 <3"
  linkify-it: ">=5.0.1 <6"
  markdown-it: ">=14.2.0 <15"
  piscina: ">=4.9.4 <5"
  "next@<16.4.3": "16.4.3"
  postcss: ">=8.5.23 <9"
  qs: ">=6.16.0 <7"
  sharp: ">=0.35.5 <0.36"
  shell-quote: ">=1.11.0 <2"
  systeminformation: ">=5.31.7 <6"
  tmp: ">=0.2.6 <0.3"
  uuid: ">=11.1.1 <12"
  file-type: ">=21.3.2 <22"
  vitest: ">=5.0.5 <6"
  webpack-dev-server: ">=5.2.6 <6"
  websocket-driver: ">=0.7.5 <0.8"
  ws: ">=8.21.0 <9"
  http-cache-semantics: ">=4.3.0 <5"
  "nx>smol-toml": ">=1.9.0 <2"
  browserslist: ">=4.28.7 <5"
  image-size: ">=2.0.3 <3"
  "@fastify/busboy": ">=3.2.2 <4"
  source-map-js: ">=1.2.2 <2"
  proxy-addr: ">=2.0.8 <3"
  "postcss-selector-parser@7": ">=7.1.6 <8"
  "@graphql-tools/url-loader>@graphql-tools/wrap": ">=11.2.1 <12"
  undici: ">=7.29.1 <8"
  follow-redirects: ">=1.16.2 <2"
  "glob@>=9": ">=14.0.2 <15"
  "body-parser@1": ">=1.20.9 <2"
  # deepmerge has no upstream fix for GHSA-gcqx-w48m-w2h4; this fork is upstream 4.3.1 + a __proto__ guard.
  # Drop once deepmerge publishes a patched release.
  deepmerge: "npm:@shivammathur/deepmerge@4.3.2"

# minimatch 11 removed makeRe(); nx 23.3.1 still calls it. Drop when nx stops using minimatch.makeRe.
patchedDependencies:
  nx@23.3.1: patches/nx@23.3.1.patch
